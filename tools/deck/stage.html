<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>舞台 · 手机框居中</title>
<link rel="stylesheet" href="deck.css">
<style>
  :root{
    --ps:1.10;                 /* 手机放大倍率 */
    --pw:429px;                /* 390 × 1.10 */
    --ph:928px;                /* 844 × 1.10 */
  }
  .row{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;gap:96px;
  }

  /* ── 左右两栏 ─────────────────────────────────────────────────────── */
  .col{width:470px;display:flex;flex-direction:column}
  .col.left{align-items:flex-end;text-align:right}
  .col.right{align-items:flex-start;text-align:left}

  .cap{
    font-size:44px;font-weight:600;line-height:1.45;color:var(--ink);
    letter-spacing:.01em;
  }
  .cap .hl{color:var(--blue)}
  .cap .gold{color:var(--warm)}
  .kicker-s{font-size:19px;letter-spacing:.34em;color:var(--ink-3);margin-bottom:20px;text-indent:.34em}
  .note{
    font-size:25px;line-height:1.75;color:var(--ink-2);
    border-left:2px solid var(--line-2);padding-left:20px;
  }
  .note:empty{display:none}

  /* ── 手机 ─────────────────────────────────────────────────────────── */
  .phone{
    position:relative;flex:0 0 auto;
    width:var(--pw);height:var(--ph);
    border-radius:56px;background:var(--card);
    padding:10px;
    box-shadow:var(--sh-3), 0 0 0 1px rgba(28,28,30,.06);
  }
  .phone .screen{
    position:relative;width:calc(var(--pw) - 20px);height:calc(var(--ph) - 20px);
    border-radius:46px;overflow:hidden;background:var(--paper);
  }
  .phone iframe{
    width:390px;height:844px;border:0;display:block;
    transform:scale(var(--ps));transform-origin:0 0;
  }
  /* 顶部极简听筒条，暗示这是一台手机；不做高光、不做刘海 */
  .phone .bar{
    position:absolute;top:26px;left:50%;transform:translateX(-50%);
    width:76px;height:6px;border-radius:3px;background:rgba(28,28,30,.14);z-index:2;
  }

  .brand{
    position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:12px;
    font-size:22px;letter-spacing:.22em;color:var(--ink-3);
  }
  .brand .orb{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #B7CFFA, #3A5ED6 62%, #1A408C);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="brand"><span class="orb"></span><span>此刻</span></div>

  <div class="row">
    <div class="col left">
      <div class="kicker-s" id="kicker"></div>
      <div class="cap" id="cap"></div>
    </div>

    <div class="phone">
      <div class="bar"></div>
      <div class="screen"><iframe id="app" src="about:blank"></iframe></div>
    </div>

    <div class="col right">
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<script>
/* 一个页面服务所有 App 镜头：全部靠 URL 参数切换
     stage.html?app=?stage%3Dstaged%26theme%3Dday&k=记下&cap=照片·声音·文字&note=一次落下
   ——这样镜头表里换 app 参数就能换界面，左右字幕也一起换。 */
const q = new URLSearchParams(location.search);
const APP  = q.get('app')  || '?stage=field&theme=day';
const BASE = q.get('base') || 'http://localhost:5173/';

document.getElementById('kicker').textContent = (q.get('k') || '').toUpperCase();
document.getElementById('cap').innerHTML     = q.get('cap')  || '';
document.getElementById('note').textContent  = q.get('note') || '';

/* 注意：iframe 的 src 是「BASE + APP」，APP 自带前导 ?，所以不要再加分隔符 */
document.getElementById('app').src = BASE + APP;

window.__ready = true;
window.__setCap  = (k, c) => { document.getElementById('kicker').textContent = (k||'').toUpperCase();
                               if (c !== undefined) document.getElementById('cap').innerHTML = c; };
window.__setNote = (n) => document.getElementById('note').textContent = n || '';
</script>
</body>
</html>
