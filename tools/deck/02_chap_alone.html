<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>章节 · 一个人在外地</title>
<link rel="stylesheet" href="deck.css">
<style>
  .stage{align-items:flex-start;padding-left:150px}
  .rail{
    position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--blue);
    transform:scaleY(0);transform-origin:50% 0;opacity:.85;
  }
  .idx{
    font-size:120px;font-weight:200;color:var(--ink-3);opacity:0;line-height:1;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="rail an-fade" style="animation-delay:.2s;animation-name:fade"></div>

  <div class="idx an-rise" style="animation-delay:.25s">01</div>
  <div class="gap-sm"></div>

  <div class="kicker an-rise" style="animation-delay:.5s">一 个 人 在 外 地</div>
  <div class="gap"></div>

  <div class="title" style="text-align:left;max-width:1120px">
    <div class="line an-rise" style="animation-delay:.9s">宿舍门口，有<span class="hl">一棵树</span>。</div>
  </div>
  <div class="gap"></div>

  <div class="sub an-rise" style="animation-delay:1.55s;text-align:left">
    因为树干上一道纹路，他记了它一整个秋天。<br>
    风声、照片、只有自己知道的那句话——一次留下。
  </div>

  <div class="gap-lg"></div>
  <div class="rule an-grow" style="animation-delay:2.1s"></div>
</div>

<script>
document.querySelector('.rail').animate(
  [{transform:'scaleY(0)'},{transform:'scaleY(1)'}],
  {duration:900,delay:200,fill:'both',easing:'cubic-bezier(.22,.61,.36,1)'});
window.__DURATION=2900;
window.__seek=(t)=>document.getAnimations().forEach(a=>{try{a.pause();a.currentTime=t}catch(e){}});
window.__ready=true;
</script>
</body>
</html>
