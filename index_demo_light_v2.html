<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fdfdfc" />
<title>此刻 · 首页（昼版 v2）</title>
<style>
  /* ============================================================
     此刻 · 首页 定稿候选（昼 · 纸 · 光）
     ------------------------------------------------------------
     本版相对 index_demo_light.html 的改动，全部来自 14 号文档的结论：
       ① 删掉「今天，你拥有 2 小时 47 分钟」——唯一一处数字语言（14 §8 第 1 条）
       ② 那个位置换成「生活证据」：今天还没有留下什么。 / 18:32 · 窗外，有一段风声
       ③ 球体亮部 #C3D8F7 → #B7CFFA，让「一屏唯一的一点颜色」立得住（14 §5）
       ④ 灰面 #F4F4F6 → #F1F1F3，把球从白底上托起来（14 §5）
       ⑤ 页面身份移到左上（「此刻」+ 日期），球下只留一句球在说的话（14 §3 A6）
       ⑥ 球下不再写第二遍「此刻」——一屏只留一个发光体（14 §3 ①）
     交互与动效一律沿用 13：按住 600ms → 四向刻度 → 四种「留下」。
     ============================================================ */
  :root{
    --paper:#F5F5F3;          /* 舞台底（demo 外壳，不属于产品 UI） */
    --screen:#FDFDFC;         /* 屏幕底：哑光纸白，不是死白 */
    --fill:#F1F1F3;           /* 灰面（14 §5：由 #F4F4F6 压深半档） */
    --ink:#101011;
    --ink-2:#5B5B5F;
    --ink-3:#9A9A9F;
    --ink-4:#C4C4C9;
    --line:#EBEBED;
    --line-2:#E2E2E6;
    --black:#111112;
    --d-voice:#7566E8;   /* 听见 */
    --d-photo:#3A5ED6;   /* 看见 */
    --d-write:#3FAF91;   /* 写下 */
    --d-blank:#B4B4BA;   /* 什么也不留 */
    --c1:#B7CFFA;        /* 球亮部（14 §5：由 #C3D8F7 提饱和一档） */
    --c2:#3A5ED6;        /* 球暗部：纯靛蓝 */
    --sans:'Inter Tight','Inter','Helvetica Neue',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    --serif:'Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',Georgia,serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* ============ 舞台（demo 外壳，不属于产品） ============ */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
  .hintbar{
    display:flex;gap:18px;align-items:center;font-size:11px;color:#AEAEB4;
    letter-spacing:.06em;position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    white-space:nowrap;
  }
  .hintbar b{color:#7C7C82;font-weight:600}
  .hintbar i{font-style:normal;color:#D2D2D6}

  /* ============ 手机 ============ */
  .phone{
    position:relative;width:375px;height:812px;border-radius:42px;overflow:hidden;
    background:var(--screen);
    border:1px solid #E4E4E6;
    box-shadow:0 30px 70px -24px rgba(16,16,18,.26),0 6px 18px rgba(16,16,18,.05);
    transform-origin:center center;
    cursor:default;
  }

  canvas{display:block}
  .spark-canvas{position:absolute;left:0;top:0;width:375px;height:812px;z-index:3;pointer-events:none}

  .ui{position:absolute;inset:0;z-index:4}

  /* ---------- 状态栏 ---------- */
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px 0 30px;font-size:12px;font-weight:600;letter-spacing:.02em}
  .statusbar .r{display:flex;align-items:center;gap:5px}
  .statusbar .bars{display:flex;align-items:flex-end;gap:2px;height:10px}
  .statusbar .bars s{display:block;width:3px;background:var(--ink);border-radius:1px}
  .statusbar .bars s:nth-child(1){height:3.5px}
  .statusbar .bars s:nth-child(2){height:5.5px}
  .statusbar .bars s:nth-child(3){height:7.5px}
  .statusbar .bars s:nth-child(4){height:9.5px}
  .statusbar .bat{width:22px;height:10.5px;border:1.2px solid rgba(16,16,18,.35);border-radius:3px;position:relative}
  .statusbar .bat::after{content:'';position:absolute;inset:1.5px 5px 1.5px 1.5px;background:var(--ink);border-radius:1.5px}
  .statusbar .bat::before{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);
    width:1.6px;height:4px;background:rgba(16,16,18,.3);border-radius:0 1px 1px 0}

  /* ---------- 顶栏：页面身份，左上，两行 ----------
     14 §3 骨架 ②：标题压顶、不与主体中心对齐。 */
  .topbar{position:absolute;top:50px;left:30px;right:26px;display:flex;align-items:flex-start;
    justify-content:space-between;transition:opacity .28s ease}
  .who{display:flex;flex-direction:column;gap:7px}
  .brand{font-family:var(--serif);font-size:15px;letter-spacing:.34em;color:var(--ink)}
  .today{font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .iconbtn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid #EFEFF1;box-shadow:0 3px 10px rgba(16,16,18,.07);
    cursor:pointer;transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s;margin-top:2px}
  .iconbtn:active{transform:scale(.92)}
  .iconbtn svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn.dim{background:var(--fill);border-color:transparent;box-shadow:none}
  .iconbtn.dim svg{stroke:var(--ink-3)}

  /* ---------- 球：整屏唯一的发光体 / 唯一的颜色 ---------- */
  .orbwrap{position:absolute;left:50%;top:358px;width:300px;height:300px;margin:-150px 0 0 -150px;
    transform:translateY(0) scale(1);transition:transform .5s cubic-bezier(.22,1,.36,1)}
  .orbwrap.pull{transform:translateY(-14px) scale(1.02)}
  .orb-canvas{position:absolute;left:10px;top:10px;width:280px;height:280px}

  /* 涟漪：留下之后唯一的一点点回响，不是庆祝 */
  .ripple{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;
    border-radius:50%;border:1px solid rgba(16,16,18,.20);opacity:0;pointer-events:none}
  .ripple.go{animation:rip .95s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rip{
    0%{transform:scale(.72);opacity:.30}
    100%{transform:scale(1.72);opacity:0}
  }

  /* ---------- 四向刻度 ----------
     贴着球的轮廓长出来：每个方向先量自身尺寸，再按「球半径 + 间距」定位。 */
  .spokes{position:absolute;inset:0;pointer-events:none}
  .spoke{position:absolute;left:50%;top:50%;display:flex;align-items:center;justify-content:center;
    gap:7px;opacity:0;transform:translate(-50%,-50%) scale(.84);filter:blur(4px);
    pointer-events:none;white-space:nowrap;
    transition:opacity .34s ease,transform .46s cubic-bezier(.22,1.25,.36,1),filter .34s ease}
  .spoke.up{flex-direction:column-reverse}
  .spoke.down{flex-direction:column}
  .spoke.right{flex-direction:row}
  .spoke.left{flex-direction:row-reverse}
  .spoke .dot{position:relative;width:5px;height:5px;border-radius:50%;background:var(--sc);
    flex:0 0 auto;transition:transform .26s cubic-bezier(.3,1.4,.5,1)}
  .spoke .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;
    border:1px solid var(--sc);opacity:0;transform:scale(.65);
    transition:opacity .26s ease,transform .26s cubic-bezier(.3,1.4,.5,1)}
  .spoke[data-dir=left] .dot{background:none;border:1px solid var(--sc)}
  .spoke .txt{display:flex;flex-direction:column;align-items:center}
  .spoke .nm{display:block;font-family:var(--serif);font-size:13px;letter-spacing:.16em;
    color:var(--ink-2);transition:color .22s,letter-spacing .22s}
  .spoke .ds{display:block;font-size:8.5px;letter-spacing:.16em;color:var(--ink-4);
    margin-top:3px;transition:color .22s}
  .spoke[data-dir=left] .nm{font-size:12px;letter-spacing:.08em}
  .spoke.armed{pointer-events:auto;cursor:pointer}
  .spoke.hot .dot{transform:scale(1.55)}
  .spoke.hot .dot::after{opacity:.40;transform:scale(1)}
  .spoke.hot .nm{color:var(--sc);letter-spacing:.2em}
  .spoke.hot .ds{color:var(--sc);opacity:.6}

  /* ---------- 球下的那一句 ----------
     清空态：陈述，不评价。有记录：最近一次留下的「生活证据」。
     —— 这个位置原本写的是「今天，你拥有 2 小时 47 分钟」，本次替换。
     没有数字、没有条数、没有完成度。 */
  .notes{position:absolute;left:0;right:0;top:486px;height:44px;text-align:center}
  .note{position:absolute;left:0;right:0;top:0;
    font-family:var(--serif);font-size:13.5px;line-height:1.7;letter-spacing:.06em;
    color:var(--ink-3);opacity:0;transform:translateY(4px);
    transition:opacity .5s ease,transform .5s ease;
    padding:0 40px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
  .note.on{opacity:1;transform:none}
  .note.lit{color:var(--ink-2)}

  /* ---------- 按住此刻：整屏唯一的确定 ---------- */
  .btnwrap{position:absolute;left:26px;right:26px;top:600px}
  .holdbtn{
    position:relative;width:100%;height:52px;border:0;border-radius:999px;background:var(--black);
    color:#fff;font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.06em;
    cursor:pointer;overflow:hidden;user-select:none;touch-action:none;
    transition:transform .34s cubic-bezier(.22,1,.36,1),background .3s,box-shadow .3s;
    box-shadow:0 10px 24px -8px rgba(16,16,18,.34);
  }
  .holdbtn:active{transform:scale(.975)}
  .holdbtn span{position:relative;z-index:2;transition:opacity .26s ease}
  .holdbtn.lock{background:#1B1B1D;box-shadow:0 6px 18px -10px rgba(16,16,18,.5)}
  .holdbtn.ghost{background:var(--fill);color:var(--ink-2);box-shadow:none;letter-spacing:.12em}
  .holdbtn.hide span{opacity:0}
  .prog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:1.6px;width:0;
    background:#fff;border-radius:2px;z-index:1;opacity:.9}
  .progtrack{position:absolute;left:0;right:0;top:calc(100% + 7px);height:1.6px;
    border-radius:2px;background:var(--line);overflow:hidden;opacity:0;transition:opacity .2s}
  .progtrack.on{opacity:1}
  .progtrack i{display:block;height:100%;width:0;background:var(--black);border-radius:2px}

  /* ---------- 交互提示（只在按住/展开时出现） ---------- */
  .hint{position:absolute;left:0;right:0;top:668px;text-align:center;font-size:10.5px;
    color:var(--ink-4);letter-spacing:.1em;opacity:0;transition:opacity .3s ease,color .3s}
  .hint.on{opacity:1}
  .hint b{color:var(--ink-3);font-weight:600}

  /* ---------- TabBar ---------- */
  .tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;
    background:#fff;border-radius:999px;padding:6px 8px;border:1px solid #F1F1F3;
    box-shadow:0 10px 30px -6px rgba(16,16,18,.16),0 2px 6px rgba(16,16,18,.06);
    z-index:8;transition:opacity .3s ease,transform .34s cubic-bezier(.22,1,.36,1)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:5px 0 4px;
    color:#B6B6BC;cursor:pointer;transition:color .22s}
  .tabbar a.on{color:var(--ink)}
  .tabbar a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .tabbar a b{font-size:9px;font-weight:600;letter-spacing:.04em}

  /* ============ 全屏浮层 ============ */
  .sheet{
    position:absolute;inset:0;z-index:20;background:var(--screen);display:none;flex-direction:column;
    opacity:0;transform:translateY(14px);
    transition:opacity .3s ease,transform .38s cubic-bezier(.22,1,.36,1);
  }
  .sheet:not(.open){pointer-events:none}
  .sheet.open{opacity:1;transform:translateY(0)}
  .sheet .sbar2{display:flex;align-items:center;justify-content:space-between;padding:56px 22px 0;flex:0 0 auto}
  .sheet .stitle{font-size:11px;letter-spacing:.24em;color:var(--ink-3);font-weight:600}
  .txtbtn{font-size:12px;color:var(--ink-3);letter-spacing:.1em;cursor:pointer;padding:6px 0;transition:color .2s}
  .txtbtn:hover{color:var(--ink)}
  .sheet .scap{padding:22px 30px 0;text-align:center}
  .sheet .scap h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.04em;
    line-height:1.6;color:var(--ink)}
  .sheet .scap p{margin:8px 0 0;font-size:10.5px;color:var(--ink-4);letter-spacing:.08em}

  /* --- 拍照 --- */
  .viewfinder{position:relative;margin:24px 28px 0;flex:1 1 auto;border-radius:24px;overflow:hidden;
    background:#FAFAF9;box-shadow:inset 0 0 0 1px #EDEDEF}
  .viewfinder canvas{position:absolute;inset:0;width:100%;height:100%}
  .vf-corner{position:absolute;width:17px;height:17px;border:1.4px solid rgba(16,16,18,.20);opacity:.9}
  .vf-corner.tl{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:5px 0 0 0}
  .vf-corner.tr{right:14px;top:14px;border-left:0;border-bottom:0;border-radius:0 5px 0 0}
  .vf-corner.bl{left:14px;bottom:14px;border-right:0;border-top:0;border-radius:0 0 0 5px}
  .vf-corner.br{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 5px 0}
  .vf-meta{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:9.5px;
    color:rgba(16,16,18,.34);letter-spacing:.24em}
  .vf-focus{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;
    border:1.2px solid rgba(16,16,18,.26);border-radius:6px;opacity:0}
  .vf-focus.go{animation:focus 1.1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes focus{
    0%{opacity:0;transform:scale(1.35)}
    22%{opacity:1;transform:scale(1)}
    70%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1)}
  }
  .shutterwrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:26px 0 40px;gap:14px}
  .shutter{position:relative;width:70px;height:70px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;
    transition:transform .3s cubic-bezier(.22,1.3,.36,1)}
  .shutter canvas{position:absolute;left:0;top:0;width:70px;height:70px}
  .shutter:active{transform:scale(.9)}
  .shutter .ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--line-2)}

  /* --- 写 --- */
  .paper{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:0 34px 64px}
  .paper textarea{
    width:100%;height:230px;border:0;outline:0;resize:none;background:transparent;text-align:center;
    font-family:var(--serif);font-size:21px;line-height:1.95;letter-spacing:.02em;color:var(--ink);
    caret-color:var(--ink);
  }
  .paper textarea::placeholder{color:#CFCFD4}
  .wc{text-align:center;font-size:10px;color:var(--ink-4);letter-spacing:.14em;height:14px;
    font-variant-numeric:tabular-nums}

  /* --- 录音 --- */
  .voicewrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    position:relative;padding-bottom:78px}
  .voicewrap canvas{width:250px;height:250px}

  /* --- 什么也不留 --- */
  .blankwrap{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .dashed{width:126px;height:126px;border-radius:50%;border:1.4px dashed #C8C8CE;
    display:flex;align-items:center;justify-content:center}
  .dashed.go{animation:spin .75s cubic-bezier(.3,.9,.3,1) forwards}
  @keyframes spin{
    0%{transform:rotate(0deg) scale(.86);opacity:.4}
    100%{transform:rotate(120deg) scale(1);opacity:1}
  }
  .blankwrap .bt{font-family:var(--serif);font-size:17px;letter-spacing:.08em;color:var(--ink-2);text-align:center}
  .blankwrap .bs{font-size:10.5px;color:var(--ink-4);letter-spacing:.12em;text-align:center;margin-top:-12px}

  /* --- 通用底部按钮 --- */
  .footbtn{flex:0 0 auto;padding:0 26px 42px}
  .bigbtn{width:100%;height:52px;border:0;border-radius:999px;background:var(--black);color:#fff;
    font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.06em;cursor:pointer;
    transition:transform .2s,background .3s,color .3s,opacity .3s;
    box-shadow:0 10px 24px -8px rgba(16,16,18,.34)}
  .bigbtn:active{transform:scale(.98)}
  .bigbtn.off{background:var(--fill);color:#B4B4BA;box-shadow:none;cursor:default}

  /* 白闪 */
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  .flash.go{animation:fl .42s ease-out forwards}
  @keyframes fl{
    0%{opacity:0}
    9%{opacity:.92}
    100%{opacity:0}
  }

  /* 浮层打开时，首页元素整体淡出 */
  .ui.dimmed .topbar,.ui.dimmed .notes,.ui.dimmed .btnwrap,.ui.dimmed .hint{opacity:0;
    transition:opacity .24s ease}
  .ui.dimmed .topbar{pointer-events:none}

  @media (max-width:640px){
    .hintbar{display:none}
  }

  /* #static：截图验收用，直接定格终态 */
  body.static *{transition:none !important;animation-duration:.01s !important;animation-delay:0s !important}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.2V12l3.6 2.2"/></symbol>
  <symbol id="i-find" viewBox="0 0 24 24"><path d="M12 4.4v15.2"/><circle cx="12" cy="8.8" r="2.4"/><circle cx="12" cy="15.6" r="2.4"/></symbol>
  <symbol id="i-know" viewBox="0 0 24 24"><path d="M4.9 11.2c0-3.5 3.2-6.3 7.1-6.3s7.1 2.8 7.1 6.3-3.2 6.3-7.1 6.3c-.8 0-1.6-.1-2.3-.3L5.6 19l.9-2.6a6.1 6.1 0 01-1.6-5.2z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6.4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.6" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
</svg>

<div class="stage">
  <div class="hintbar">
    <span>此刻 · 首页（昼版 v2）</span>
    <i>|</i>
    <span>按住 <b>「按住此刻」</b> 不放 → 四向刻度展开</span>
    <i>|</i>
    <span>Esc 取消 · R 重来</span>
  </div>

  <div class="phone" id="phone">
    <canvas class="spark-canvas" id="sparkCanvas"></canvas>

    <div class="ui" id="ui">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="r">
          <span class="bars"><s></s><s></s><s></s><s></s></span>
          <span class="bat"></span>
        </span>
      </div>

      <!-- 页面身份：左上，两行。不与球中心对齐。 -->
      <header class="topbar" id="topbar">
        <span class="who">
          <span class="brand">此刻</span>
          <span class="today" id="today">09.26 星期六</span>
        </span>
        <span class="iconbtn dim" id="moreBtn"><svg><use href="#i-more"/></svg></span>
      </header>

      <div class="orbwrap" id="orbwrap">
        <canvas class="orb-canvas" id="orbCanvas"></canvas>
        <div class="ripple" id="ripple"></div>

        <div class="spokes" id="spokes">
          <div class="spoke up" data-dir="up" style="--sc:var(--d-voice)">
            <span class="dot"></span>
            <span class="txt"><span class="nm">听见</span><span class="ds">录音</span></span>
          </div>
          <div class="spoke right" data-dir="right" style="--sc:var(--d-photo)">
            <span class="dot"></span>
            <span class="txt"><span class="nm">看见</span><span class="ds">拍照</span></span>
          </div>
          <div class="spoke down" data-dir="down" style="--sc:var(--d-write)">
            <span class="dot"></span>
            <span class="txt"><span class="nm">写下</span><span class="ds">一句话</span></span>
          </div>
          <div class="spoke left" data-dir="left" style="--sc:var(--d-blank)">
            <span class="dot"></span>
            <span class="txt"><span class="nm">什么也不留</span><span class="ds">不留痕</span></span>
          </div>
        </div>
      </div>

      <!-- 球在说的那一句。没有数字。 -->
      <div class="notes" id="notes">
        <div class="note" id="noteA"></div>
        <div class="note" id="noteB"></div>
      </div>

      <div class="btnwrap">
        <button class="holdbtn" id="holdBtn"><span>按住此刻</span></button>
        <div class="progtrack" id="progTrack"><i id="progBar"></i></div>
      </div>

      <p class="hint" id="hint"></p>

      <nav class="tabbar" id="tabbar">
        <a class="on"><svg><use href="#i-now"/></svg><b>此刻</b></a>
        <a><svg><use href="#i-time"/></svg><b>时间</b></a>
        <a><svg><use href="#i-find"/></svg><b>发现</b></a>
        <a><svg><use href="#i-know"/></svg><b>理解</b></a>
      </nav>
    </div>

    <div class="sheet" id="sheet"></div>
    <div class="flash" id="flash"></div>
  </div>
</div>

<script>
(function(){
'use strict';

var DPR = 2;
var W = 375, H = 812;
var STATIC = location.hash.indexOf('static') >= 0;

/* ================= 基础工具 ================= */
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h.split('').map(function(c){return c+c}).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mix(a, b, t){
  return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' +
                  Math.round(a[1]+(b[1]-a[1])*t) + ',' +
                  Math.round(a[2]+(b[2]-a[2])*t) + ')';
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function $(id){ return document.getElementById(id); }

function setupCanvas(cv, w, h){
  cv.width = Math.round(w * DPR);
  cv.height = Math.round(h * DPR);
  var ctx = cv.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return ctx;
}

/* ================= 球体 =================
   一层网点，预渲染到离屏 canvas；每帧只做 drawImage + 高光 + 描边。
   呼吸 = 网点的整体聚散，不是形状变形（白底上形状抖动会脏）。
   亮部 #B7CFFA 是 14 §5 的取值：素材里那「一点彩光」饱和度普遍偏高，
   亮部太灰整颗球在白底上会发闷。 */
function Orb(canvas, CW, CH){
  this.cv = canvas;
  this.CW = CW || 280; this.CH = CH || 280;
  this.CX = this.CW / 2; this.CY = this.CH / 2;

  canvas.width  = Math.round(this.CW * DPR);
  canvas.height = Math.round(this.CH * DPR);
  canvas.style.width  = this.CW + 'px';
  canvas.style.height = this.CH + 'px';
  this.ctx = canvas.getContext('2d');
  this.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  this.base = { size:190, gap:3.10, c1:'#B7CFFA', c2:'#3A5ED6' };
  this.level = 0;              /* 留下得越多，网点越密。没有数字，密度就是那个数字。 */

  this.breathe = 0;
  this.press = 0;   this.pressT = 0;
  this.feed = 0;    this.feedV = 0;
  this.dirA = 0;    this.dirAmt = 0;  this.dirT = 0;
  this.intro = STATIC ? 1 : 0;

  this.build();
}

Orb.prototype.geom = function(){
  var L = Math.min(this.level, 9);
  var a = hex2rgb(this.base.c2), b = [26, 64, 140], t = L * 0.085;
  return {
    size: this.base.size + L * 2.1,
    gap:  this.base.gap  - L * 0.052,
    c1:   this.base.c1,
    c2:   [Math.round(a[0]+(b[0]-a[0])*t),
           Math.round(a[1]+(b[1]-a[1])*t),
           Math.round(a[2]+(b[2]-a[2])*t)]
  };
};

Orb.prototype.build = function(){
  var g = this.geom();
  var size = g.size, R = size / 2, gap = g.gap;
  var c1 = hex2rgb(g.c1);
  var c2 = g.c2;
  var rnd = mulberry32(20260926 + this.level * 37);

  var off = document.createElement('canvas');
  off.width = Math.round(size * DPR);
  off.height = Math.round(size * DPR);
  var c = off.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  var hx = size * 0.30, hy = size * 0.24;   /* 受光点：左上 */

  for(var y = gap * 0.5; y < size; y += gap){
    var shift = (Math.round(y / gap) % 2) ? gap * 0.5 : 0;
    for(var x = gap * 0.5 + shift; x < size; x += gap){
      var dx = (x - R) / R, dy = (y - R) / R;
      var d = Math.sqrt(dx*dx + dy*dy);
      if(d > 1) continue;

      var hdx = x - hx, hdy = y - hy;
      var lum = 1 - Math.min(1, Math.sqrt(hdx*hdx + hdy*hdy) / (R * 1.36));
      lum = lum * lum * (3 - 2 * lum);

      var shade = clamp(((x - R) * 0.62 + (y - R) * 0.78) / (R * 1.58) + 0.5, 0, 1);

      var edgeD = clamp((1 - d) / 0.13, 0, 1); edgeD = edgeD * edgeD * (3 - 2 * edgeD);
      var edgeA = clamp((1 - d) / 0.08, 0, 1); edgeA = edgeA * edgeA * (3 - 2 * edgeA);

      var t = 1 - clamp(shade * 0.86 - lum * 0.34, 0, 0.95);

      var r = gap * 0.555 * (1 - 0.46 * lum) * (0.30 + 0.70 * edgeD);
      r *= 0.96 + rnd() * 0.08;
      if(r < 0.13) continue;

      var a = (0.93 + rnd() * 0.07) * edgeA;

      c.beginPath();
      c.arc(x, y, r, 0, 6.2832);
      c.fillStyle = mix(c2, c1, t);
      c.globalAlpha = a;
      c.fill();
    }
  }
  c.globalAlpha = 1;

  this.tex = off;
  this.size = size;
};

Orb.prototype.render = function(dt, t){
  var ctx = this.ctx;
  ctx.clearRect(0, 0, this.CW, this.CH);

  var k = Math.min(1, dt * 11);
  this.press += (this.pressT - this.press) * k;
  this.dirAmt += (this.dirT - this.dirAmt) * Math.min(1, dt * 9);

  /* 进食弹簧：k=58, c=8.2（阻尼比锁 1.0，不过冲——三条禁令第 ② 条） */
  this.feedV += (-this.feed * 58 - this.feedV * 8.2) * dt;
  this.feed  += this.feedV * dt;

  if(this.intro < 1) this.intro = Math.min(1, this.intro + dt / 1.05);

  var b = STATIC ? 0 : Math.sin(t * 1.05);
  var e = this.intro < 1 ? (1 - Math.pow(1 - this.intro, 3)) : 1;

  var sc = 1
    + b * 0.010 * (1 - this.press * 0.6)
    - this.press * 0.072
    + this.feed * 0.062;

  sc *= lerp(0.80, 1, e);

  var ang = this.dirA;
  var dx = Math.cos(ang) * this.dirAmt * 9;
  var dy = Math.sin(ang) * this.dirAmt * 9;

  var size = this.size;
  var w = size * sc, h = size * sc;

  ctx.save();
  ctx.globalAlpha = e;
  ctx.drawImage(this.tex, this.CX - w/2 + dx, this.CY - h/2 + dy, w, h);
  ctx.restore();

  var hlR = (size * 0.42) * sc * (1 - this.press * 0.30 + this.feed * 0.22);
  var hlA = 0.44 + this.press * 0.20 + this.feed * 0.12;
  var hcx = this.CX + dx * 0.7 - size * 0.20 * sc;
  var hcy = this.CY + dy * 0.7 - size * 0.26 * sc;

  var gr = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, Math.max(1, hlR));
  gr.addColorStop(0, 'rgba(255,255,255,' + hlA.toFixed(3) + ')');
  gr.addColorStop(0.55, 'rgba(255,255,255,' + (hlA * 0.27).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(this.CX + dx, this.CY + dy, w / 2, 0, 6.2832);
  ctx.fillStyle = gr;
  ctx.globalAlpha = e;
  ctx.fill();
  ctx.globalAlpha = 1;

  /* 外圈 1px 白内衬：把球从白底上托起来，不用投影（白底只允许两档阴影） */
  ctx.beginPath();
  ctx.arc(this.CX + dx, this.CY + dy, (w / 2) - 0.7, 0, 6.2832);
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.50 * e).toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.stroke();

  if(this.press > 0.01){
    var gh = ctx.createRadialGradient(this.CX, this.CY, w/2 * 0.92, this.CX, this.CY, w/2 * 1.30);
    gh.addColorStop(0, 'rgba(58,94,214,' + (0.13 * this.press).toFixed(3) + ')');
    gh.addColorStop(1, 'rgba(58,94,214,0)');
    ctx.beginPath();
    ctx.arc(this.CX, this.CY, w/2 * 1.30, 0, 6.2832);
    ctx.fillStyle = gh;
    ctx.fill();
  }
};

Orb.prototype.pulse = function(v){ this.feedV = v; };
Orb.prototype.densify = function(){
  if(this.level >= 9) return;
  this.level++;
  this.build();
};
Orb.prototype.reset = function(){ this.level = 0; this.build(); };

/* ================= 粒子 ================= */
function Sparks(canvas){
  this.ctx = setupCanvas(canvas, W, H);
  this.list = [];
}
Sparks.prototype.burst = function(x, y, tx, ty, color, n){
  n = n || 64;
  var rnd = mulberry32((Date.now() & 0xffff) + n);
  for(var i = 0; i < n; i++){
    var a = rnd() * 6.2832;
    var sp = 20 + rnd() * 90;
    this.list.push({
      x: x + (rnd() - 0.5) * 26,
      y: y + (rnd() - 0.5) * 26,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      tx: tx, ty: ty,
      life: 0, dur: 0.62 + rnd() * 0.30,
      r: 1.0 + rnd() * 2.0,
      c: color
    });
  }
};
Sparks.prototype.update = function(dt){
  var L = this.list, keep = [];
  for(var i = 0; i < L.length; i++){
    var p = L[i];
    p.life += dt;
    var k = p.life / p.dur;
    if(k >= 1){
      if(!p.done && this.onArrive){ this.onArrive(); p.done = true; }
      continue;
    }
    var e = k * k * (3 - 2 * k);
    var burst = Math.sin(Math.PI * Math.min(1, k * 2.1)) * 0.42;
    var px = lerp(p.x, p.tx, e) + p.vx * burst * 0.9;
    var py = lerp(p.y, p.ty, e) + p.vy * burst * 0.9;
    p.px = px; p.py = py;
    p.alpha = (1 - k) * 0.9;
    p.rr = p.r * (1 - k * 0.45);
    keep.push(p);
  }
  this.list = keep;
};
Sparks.prototype.draw = function(){
  var ctx = this.ctx;
  ctx.clearRect(0, 0, W, H);
  var L = this.list;
  for(var i = 0; i < L.length; i++){
    var p = L[i];
    if(p.px == null) continue;
    ctx.beginPath();
    ctx.arc(p.px, p.py, p.rr, 0, 6.2832);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.c;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
};

/* ================= 全局状态 ================= */
var HOLD_MS = 600;
var DIRS = {
  up:    { ang: -Math.PI/2, mode:'voice',  color:'#7566E8' },
  right: { ang: 0,          mode:'photo',  color:'#3A5ED6' },
  down:  { ang: Math.PI/2,  mode:'write',  color:'#3FAF91' },
  left:  { ang: Math.PI,    mode:'blank',  color:'#B4B4BA' }
};

var state = 'idle';       /* idle | arming | choosing | mode */
var armT = 0;
var hotDir = null;
var raf = null, last = 0;
var orb = new Orb($('orbCanvas'));
var sparks = new Sparks($('sparkCanvas'));

var $ui      = $('ui');
var $spokes  = $('spokes');
var $hold    = $('holdBtn');
var $progTrack = $('progTrack');
var $progBar = $('progBar');
var $hint    = $('hint');
var $ripple  = $('ripple');
var $sheet   = $('sheet');
var $flash   = $('flash');
var $topbar  = $('topbar');

/* ================= 今天留下过什么 =================
   注意：这里存的是「生活证据」，不是计数。界面上永远不出现条数、
   不出现时长、不出现完成度。「什么也不留」不进这个数组。 */
var today = [];
var noteSlot = 0;

function noteEl(){ return noteSlot === 0 ? $('noteA') : $('noteB'); }
function otherEl(){ return noteSlot === 0 ? $('noteB') : $('noteA'); }

function setNote(text, lit){
  var el = noteEl(), prev = otherEl();
  el.textContent = text;
  el.classList.toggle('lit', !!lit);
  prev.classList.remove('on');
  el.classList.add('on');
  noteSlot = 1 - noteSlot;
}

function renderNote(){
  if(!today.length){
    setNote('今天还没有留下什么。', false);
  }else{
    var it = today[today.length - 1];
    setNote(it.t + ' · ' + it.text, true);
  }
}

function nowStamp(){
  var d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ================= 日期 / 时间 ================= */
var WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function renderClock(){
  var d = new Date();
  $('clock').textContent = d.getHours() + ':' + pad(d.getMinutes());
  $('today').textContent = pad(d.getMonth()+1) + '.' + pad(d.getDate()) + ' ' + WD[d.getDay()];
}
renderClock();
setInterval(renderClock, 20000);

/* ================= 缩放适配 ================= */
function fit(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var s;
  if(vw < 640){
    s = Math.min(vw / W, vh / H);
  }else{
    s = Math.min(1, (vh - 96) / H, vw / (W + 80));
  }
  $('phone').style.transform = 'scale(' + s + ')';
  document.querySelector('.stage').style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();
if(STATIC) document.body.classList.add('static');

/* ================= 主循环 ================= */
function loop(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  var t = now / 1000;

  if(state === 'arming'){
    armT += dt;
    var p = clamp(armT / (HOLD_MS / 1000), 0, 1);
    $progBar.style.width = (p * 100) + '%';
    orb.pressT = p * 0.85;
    if(p >= 1) enterChoosing();
  }else{
    $progBar.style.width = '0%';
    orb.pressT = (state === 'choosing') ? 0.55 : orb.pressT * 0.82;
  }

  orb.render(dt, t);
  sparks.update(dt);
  sparks.draw();

  raf = requestAnimationFrame(loop);
}

/* ================= 按住 → 四向 ================= */
function hintOn(html){
  if(html === null){ $hint.classList.remove('on'); return; }
  $hint.innerHTML = html;
  $hint.classList.add('on');
}

function startArm(e){
  if(state !== 'idle') return;
  state = 'arming';
  armT = 0;
  $progTrack.classList.add('on');
  $hold.classList.add('lock');
  $('orbwrap').classList.add('pull');
  hintOn('别松手，稍等一会儿');
}

/* ================= 四向刻度 =================
   先量每个标签自身的尺寸，再按「球半径 + 间距」往外定位 —— 这样
   「听见」两字和「什么也不留」五字离球边缘一样远，不会被球压住。 */
var ORB_R = 88, ORB_GAP = 12;
function layoutSpokes(){
  var list = $spokes.querySelectorAll('.spoke');
  for(var i = 0; i < list.length; i++){
    var el = list[i], d = el.getAttribute('data-dir');
    var w = el.offsetWidth, h = el.offsetHeight, tx = 0, ty = 0;
    if(d === 'up')    ty = -(ORB_R + ORB_GAP) - h / 2;
    if(d === 'down')  ty =  (ORB_R + ORB_GAP) + h / 2;
    if(d === 'left')  tx = -(ORB_R + ORB_GAP) - w / 2;
    if(d === 'right') tx =  (ORB_R + ORB_GAP) + w / 2;
    el.style.left = 'calc(50% + ' + tx.toFixed(1) + 'px)';
    el.style.top  = 'calc(50% + ' + ty.toFixed(1) + 'px)';
  }
}
layoutSpokes();
window.addEventListener('load', layoutSpokes);
window.addEventListener('resize', layoutSpokes);

var spokeSeq = 0;
function enterChoosing(){
  state = 'choosing';
  var my = ++spokeSeq;
  $progTrack.classList.remove('on');
  $hold.classList.remove('lock');
  $hold.classList.add('ghost');
  $hold.querySelector('span').textContent = '取消';
  orb.pressT = 0.55;

  var list = $spokes.querySelectorAll('.spoke');
  for(var i = 0; i < list.length; i++){
    (function(el, i){
      setTimeout(function(){
        if(my !== spokeSeq) return;
        el.style.opacity = '1';
        el.style.filter = 'blur(0)';
        el.style.transform = 'translate(-50%,-50%) scale(1)';
        el.classList.add('armed');
      }, 40 + i * 58);
    })(list[i], i);
  }
  $('notes').style.opacity = '0';
  hintOn('<b>点一个方向</b>　或者按住滑动');
}

function resetSpokes(){
  spokeSeq++;
  $hold.classList.remove('ghost','hide','lock');
  $hold.querySelector('span').textContent = '按住此刻';
  var list = $spokes.querySelectorAll('.spoke');
  for(var i = 0; i < list.length; i++){
    var el = list[i];
    el.style.opacity = '0';
    el.style.filter = 'blur(4px)';
    el.style.transform = 'translate(-50%,-50%) scale(.84)';
    el.classList.remove('armed','hot');
  }
}

function endArm(e){
  if(state === 'choosing'){
    if(hotDir) choose(hotDir);
    return;
  }
  if(state !== 'arming') return;
  if(hotDir){
    choose(hotDir);
  }else if(armT > HOLD_MS / 1000 * 0.55){
    /* 已经按了过半，就当「按住不放」，不取消 —— 给手指留容错 */
    enterChoosing();
  }else{
    cancelArm();
  }
}

function cancelArm(){
  state = 'idle';
  armT = 0;
  $progTrack.classList.remove('on');
  $hold.classList.remove('lock','hide','ghost');
  $hold.querySelector('span').textContent = '按住此刻';
  $('orbwrap').classList.remove('pull');
  $('notes').style.opacity = '1';
  orb.pressT = 0;
  orb.dirT = 0;
  hotDir = null;
  hintOn(null);
}

/* 滑动选向 */
function onMove(e){
  if(state !== 'arming' && state !== 'choosing') return;
  var r = $('phone').getBoundingClientRect();
  var s = r.width / W;
  var cx = r.left + W * s / 2;
  var cy = r.top + 358 * s;
  var dx = (e.clientX - cx) / s;
  var dy = (e.clientY - cy) / s;
  var dist = Math.sqrt(dx*dx + dy*dy);

  var d = null;
  if(dist > 56){
    var ang = Math.atan2(dy, dx);
    var best = null, bestD = 1;
    for(var k in DIRS){
      var diff = Math.abs(angDiff(ang, DIRS[k].ang));
      if(diff < bestD){ bestD = diff; best = k; }
    }
    if(bestD < 0.86) d = best;
  }
  if(d !== hotDir){
    hotDir = d;
    highlight(d);
  }
}
function angDiff(a, b){
  var d = a - b;
  while(d > Math.PI) d -= 6.2832;
  while(d < -Math.PI) d += 6.2832;
  return d;
}
function highlight(d){
  var tabs = $spokes.querySelectorAll('.spoke');
  for(var i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('hot', tabs[i].getAttribute('data-dir') === d);
  }
  if(d){
    orb.dirA = DIRS[d].ang;
    orb.dirT = 1;
    hintOn('松手就是 <b>' + dirName(d) + '</b>');
  }else{
    orb.dirT = 0;
    hintOn('<b>点一个方向</b>　或者按住滑动');
  }
}
function dirName(d){
  return { up:'听见', right:'看见', down:'写下', left:'什么也不留' }[d];
}

$spokes.addEventListener('click', function(e){
  if(state !== 'choosing') return;
  var el = e.target.closest('.spoke');
  if(!el) return;
  choose(el.getAttribute('data-dir'));
});

$('phone').addEventListener('click', function(e){
  if(state !== 'choosing') return;
  if(e.target.closest('.spoke')) return;
  if(e.target.closest('.tabbar')) return;
  closeChoosing();
});
function closeChoosing(){
  state = 'idle';
  hotDir = null;
  orb.dirT = 0;
  orb.pressT = 0;
  $('orbwrap').classList.remove('pull');
  $hold.classList.remove('hide','lock');
  $('notes').style.opacity = '1';
  resetSpokes();
  hintOn(null);
}

/* ================= 选择 → 进入模式 ================= */
function choose(d){
  if(state === 'mode') return;
  var cfg = DIRS[d];
  if(!cfg) return;
  state = 'mode';
  hotDir = null;
  orb.dirT = 0;

  orb.dirA = cfg.ang;
  orb.dirT = 0.9;
  setTimeout(function(){ orb.dirT = 0; }, 260);

  $ui.classList.add('dimmed');
  resetSpokes();
  $('orbwrap').classList.remove('pull');

  setTimeout(function(){ openSheet(cfg.mode); }, 170);
}

/* ================= 浮层 ================= */
function openSheet(mode){
  $sheet.innerHTML = '';
  $sheet.style.display = 'flex';
  void $sheet.offsetWidth;
  $sheet.classList.add('open');

  if(mode === 'photo') buildPhoto();
  if(mode === 'write') buildWrite();
  if(mode === 'voice') buildVoice();
  if(mode === 'blank') buildBlank();
}

function closeSheet(cb){
  $sheet.classList.remove('open');
  setTimeout(function(){
    $sheet.style.display = 'none';
    $sheet.innerHTML = '';
    $ui.classList.remove('dimmed');
    state = 'idle';
    orb.pressT = 0; orb.dirT = 0;
    $progTrack.classList.remove('on');
    $hold.classList.remove('hide','lock');
    $('notes').style.opacity = '1';
    $('orbwrap').classList.remove('pull');
    resetSpokes();
    hintOn(null);
    if(cb) cb();
  }, 320);
}

function sheetHead(title, onCancel){
  var d = document.createElement('div');
  d.className = 'sbar2';
  d.innerHTML = '<span class="txtbtn" data-act="cancel">取消</span>' +
                '<span class="stitle">' + title + '</span>' +
                '<span style="width:26px"></span>';
  d.querySelector('[data-act=cancel]').onclick = onCancel;
  return d;
}

/* ---------- 交回球心：碎片飞入 ---------- */
function flyBack(x, y, color){
  var r = $('phone').getBoundingClientRect();
  var s = r.width / W;
  var lx = (x - r.left) / s;
  var ly = (y - r.top) / s;
  sparks.onArrive = function(){
    sparks.onArrive = null;
    orb.pulse(3.1);
    $ripple.classList.remove('go');
    void $ripple.offsetWidth;
    $ripple.classList.add('go');
  };
  sparks.burst(lx, ly, W/2, 358, color, 68);
}

/* 留下完成：球静默变密 + 球下那句换成刚留下的东西。没有 toast、没有对勾。 */
function finish(mode, originEl, evidence){
  var color = { photo:'#9DB8F0', write:'#8FD6C0', voice:'#B3A8F2' }[mode] || '#C7D8F7';
  var r;
  if(originEl){
    r = originEl.getBoundingClientRect();
    flyBack(r.left + r.width/2, r.top + r.height/2, color);
  }else{
    var pr = $('phone').getBoundingClientRect();
    flyBack(pr.left + pr.width/2, pr.top + pr.height/2, color);
  }
  today.push({ t: nowStamp(), text: evidence });
  setTimeout(function(){
    orb.densify();
    renderNote();
  }, 420);
  closeSheet();
}

/* ================= 01 拍照 ================= */
function buildPhoto(){
  $sheet.appendChild(sheetHead('看见', function(){ closeSheet(); }));

  var cap = document.createElement('div');
  cap.className = 'scap';
  cap.innerHTML = '<h3>你看见了什么？</h3>';
  $sheet.appendChild(cap);

  var vf = document.createElement('div');
  vf.className = 'viewfinder';
  vf.innerHTML =
    '<canvas id="vfCanvas"></canvas>' +
    '<span class="vf-corner tl"></span><span class="vf-corner tr"></span>' +
    '<span class="vf-corner bl"></span><span class="vf-corner br"></span>' +
    '<span class="vf-focus" id="vfFocus"></span>' +
    '<span class="vf-meta">不用对准 · 不求清楚</span>';
  $sheet.appendChild(vf);

  var wrap = document.createElement('div');
  wrap.className = 'shutterwrap';
  var btn = document.createElement('button');
  btn.className = 'shutter';
  btn.innerHTML = '<span class="ring"></span><canvas id="shutterCanvas"></canvas>';
  wrap.appendChild(btn);
  var tip = document.createElement('span');
  tip.style.cssText = 'font-size:10px;color:var(--ink-4);letter-spacing:.2em';
  tip.textContent = '按下就是看见';
  wrap.appendChild(tip);
  $sheet.appendChild(wrap);

  /* 快门 = 同款球体材质（和首页那颗球呼应，尺寸不同） */
  requestAnimationFrame(function(){
    var sc = new Orb($('shutterCanvas'), 70, 70);
    sc.base = { size:70, gap:1.42, c1:'#B7CFFA', c2:'#3A5ED6' };
    sc.level = 0; sc.build();
    sc.intro = 1;
    var st = 0;
    (function tl(now){
      if(!document.body.contains(sc.cv)) return;
      var dt = Math.min(0.05, (st ? (now - st) / 1000 : 0.016)); st = now;
      sc.pressT = 0.10;
      sc.render(dt, now / 1000);
      requestAnimationFrame(tl);
    })(performance.now());
    btn._orb = sc;
  });

  /* 取景框里的「光」是程序生成的：两块漂移的径向渐变 + 90 颗浮动的网点 */
  var vfc = $('vfCanvas');
  var vctx = null, vw = 0, vh = 0, t0 = performance.now();
  var seeds = [];
  var rnd = mulberry32(77);
  for(var i = 0; i < 90; i++){
    seeds.push({ x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.9, s: 0.10 + rnd() * 0.34, p: rnd() * 6.28 });
  }
  function sizeVF(){
    var b = vf.getBoundingClientRect();
    vw = b.width; vh = b.height;
    vctx = setupCanvas(vfc, vw, vh);
  }
  requestAnimationFrame(sizeVF);
  window.addEventListener('resize', sizeVF);

  (function vloop(now){
    if(!document.body.contains(vfc)) return;
    if(vctx && vw){
      var tt = (now - t0) / 1000;
      vctx.clearRect(0, 0, vw, vh);

      var g1 = vctx.createRadialGradient(
        vw * (0.34 + 0.06 * Math.sin(tt * 0.31)), vh * (0.30 + 0.05 * Math.cos(tt * 0.24)), 10,
        vw * (0.34 + 0.06 * Math.sin(tt * 0.31)), vh * (0.30 + 0.05 * Math.cos(tt * 0.24)), vw * 0.95);
      g1.addColorStop(0, '#FFFFFF');
      g1.addColorStop(0.5, '#F4F5F8');
      g1.addColorStop(1, '#E8EAF0');
      vctx.fillStyle = g1;
      vctx.fillRect(0, 0, vw, vh);

      var g2 = vctx.createRadialGradient(
        vw * (0.72 + 0.05 * Math.cos(tt * 0.21)), vh * (0.74 + 0.05 * Math.sin(tt * 0.27)), 6,
        vw * (0.72 + 0.05 * Math.cos(tt * 0.21)), vh * (0.74 + 0.05 * Math.sin(tt * 0.27)), vw * 0.72);
      g2.addColorStop(0, 'rgba(190,214,247,.62)');
      g2.addColorStop(0.55, 'rgba(214,205,246,.24)');
      g2.addColorStop(1, 'rgba(255,255,255,0)');
      vctx.fillStyle = g2;
      vctx.fillRect(0, 0, vw, vh);

      for(var i = 0; i < seeds.length; i++){
        var s = seeds[i];
        var y = (s.y + tt * s.s * 0.06) % 1;
        var x = s.x + Math.sin(tt * 0.42 + s.p) * 0.012;
        var a = 0.16 + 0.24 * (0.5 + 0.5 * Math.sin(tt * 0.75 + s.p));
        vctx.beginPath();
        vctx.arc(x * vw, y * vh, s.r, 0, 6.2832);
        vctx.fillStyle = 'rgba(150,168,200,' + a.toFixed(3) + ')';
        vctx.fill();
      }
    }
    requestAnimationFrame(vloop);
  })(performance.now());

  setTimeout(function(){
    var f = $('vfFocus');
    if(f) f.classList.add('go');
  }, 620);

  btn.addEventListener('click', function(){
    if(btn.dataset.done) return;
    btn.dataset.done = '1';
    if(btn._orb) btn._orb.pressT = 0.9;

    $flash.classList.remove('go'); void $flash.offsetWidth;
    $flash.classList.add('go');

    var b = vf.getBoundingClientRect();
    setTimeout(function(){
      vf.style.transition = 'transform .42s cubic-bezier(.4,0,.2,1),opacity .42s ease';
      vf.style.transform = 'scale(1.035)';
      vf.style.opacity = '0';
      finish('photo', vf, '一张照片');
    }, 150);
  });
}

/* ================= 02 写 ================= */
function buildWrite(){
  $sheet.appendChild(sheetHead('写下', function(){ closeSheet(); }));

  var cap = document.createElement('div');
  cap.className = 'scap';
  cap.innerHTML = '<h3>此刻，你想留下一句什么？</h3>';
  $sheet.appendChild(cap);

  var paper = document.createElement('div');
  paper.className = 'paper';
  var ta = document.createElement('textarea');
  ta.placeholder = '一句话就好';
  ta.maxLength = 60;
  ta.rows = 4;
  paper.appendChild(ta);
  $sheet.appendChild(paper);

  var wc = document.createElement('div');
  wc.className = 'wc';
  $sheet.appendChild(wc);

  var foot = document.createElement('div');
  foot.className = 'footbtn';
  var btn = document.createElement('button');
  btn.className = 'bigbtn off';
  btn.textContent = '留下';
  foot.appendChild(btn);
  $sheet.appendChild(foot);

  setTimeout(function(){ ta.focus(); }, 300);

  ta.addEventListener('input', function(){
    var n = ta.value.trim().length;
    wc.textContent = n ? (n + ' 字') : '';
    btn.classList.toggle('off', !n);
  });

  function submit(){
    var v = ta.value.trim();
    if(!v) return;
    if(btn.dataset.done) return;
    btn.dataset.done = '1';
    /* 球下那句用的是「真实材料」——用户自己写的那句话，不是标签、不是渐变 */
    var ev = '「' + (v.length > 14 ? v.slice(0, 14) + '…' : v) + '」';
    ta.style.transition = 'opacity .38s ease, filter .38s ease, transform .38s ease';
    ta.style.opacity = '0';
    ta.style.filter = 'blur(3px)';
    ta.style.transform = 'scale(.97)';
    setTimeout(function(){ finish('write', ta, ev); }, 120);
  }
  btn.addEventListener('click', submit);
  ta.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') submit();
  });
}

/* ================= 03 听见 ================= */
function buildVoice(){
  $sheet.appendChild(sheetHead('听见', function(){ closeSheet(); }));

  var cap = document.createElement('div');
  cap.className = 'scap';
  cap.innerHTML = '<h3>你听见了什么？</h3><p>不用说话 · 环境声也算</p>';
  $sheet.appendChild(cap);

  var wrap = document.createElement('div');
  wrap.className = 'voicewrap';
  var cv = document.createElement('canvas');
  cv.id = 'voiceCanvas';
  wrap.appendChild(cv);
  $sheet.appendChild(wrap);

  var foot = document.createElement('div');
  foot.className = 'footbtn';
  var btn = document.createElement('button');
  btn.className = 'bigbtn';
  btn.textContent = '结束';
  foot.appendChild(btn);
  $sheet.appendChild(foot);

  var ctx = setupCanvas(cv, 250, 250);
  var N = 132;
  var vals = new Float32Array(N);
  var t0 = performance.now();
  var seed = mulberry32(((Date.now() / 1000) | 0) & 0xffff);
  var phases = [];
  for(var i = 0; i < N; i++) phases.push(seed() * 6.2832);

  /* 波形是「一圈声音的圆」，不是直线波形。全程不显示秒数。 */
  (function vloop(now){
    if(!document.body.contains(cv)) return;
    var tt = (now - t0) / 1000;
    ctx.clearRect(0, 0, 250, 250);

    var CX = 125, CY = 125, R = 76;

    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, 6.2832);
    ctx.strokeStyle = '#EFEFF1';
    ctx.lineWidth = 1;
    ctx.stroke();

    for(var i = 0; i < N; i++){
      var a = (i / N) * 6.2832 - Math.PI / 2;
      /* 包络里带停顿，像真的有人在说话 */
      var env = 0.34 + 0.66 * Math.pow(0.5 + 0.5 * Math.sin(tt * 0.9), 1.7);
      var raw = 0.5 + 0.5 * Math.sin(tt * 5.4 + phases[i]) *
                       (0.55 + 0.45 * Math.sin(tt * 2.7 + phases[i] * 1.7));
      var v = clamp(raw * env * (0.55 + 0.45 * Math.cos(a * 2.2 + tt * 1.1)), 0.03, 1);
      vals[i] += (v - vals[i]) * 0.24;

      var len = 4 + vals[i] * 34;
      var x1 = CX + Math.cos(a) * R,        y1 = CY + Math.sin(a) * R;
      var x2 = CX + Math.cos(a) * (R + len), y2 = CY + Math.sin(a) * (R + len);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(117,102,232,' + (0.18 + vals[i] * 0.62).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    var br = 26 + Math.sin(tt * 2.1) * 1.6;
    var g = ctx.createRadialGradient(CX, CY - 6, 1, CX, CY, br * 1.7);
    g.addColorStop(0, 'rgba(255,255,255,.95)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(CX, CY, br * 1.7, 0, 6.2832);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(CX, CY, br, 0, 6.2832);
    ctx.fillStyle = '#F5F4FE';
    ctx.fill();
    ctx.strokeStyle = 'rgba(117,102,232,.30)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CX, CY, 4.2, 0, 6.2832);
    ctx.fillStyle = '#7566E8';
    ctx.fill();

    requestAnimationFrame(vloop);
  })(performance.now());

  btn.addEventListener('click', function(){
    if(btn.dataset.done) return;
    btn.dataset.done = '1';
    var r = cv.getBoundingClientRect();
    cv.style.transition = 'transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease';
    cv.style.transform = 'scale(.86)';
    cv.style.opacity = '0';
    setTimeout(function(){ finish('voice', cv, '一段环境声'); }, 130);
  });
}

/* ================= 04 什么也不留 =================
   不产生记录 → 球不变密，球下那句也不变。
   「什么也不留也是一次留」，但留的不是数据。 */
function buildBlank(){
  $sheet.appendChild(sheetHead('什么也不留', function(){ closeSheet(); }));

  var wrap = document.createElement('div');
  wrap.className = 'blankwrap';
  wrap.innerHTML =
    '<div class="dashed" id="dashed"></div>' +
    '<div class="bt">这一次，什么也不留。</div>' +
    '<div class="bs">不留痕 · 不进时间流</div>';
  $sheet.appendChild(wrap);

  setTimeout(function(){
    var d = $('dashed');
    if(d) d.classList.add('go');
  }, 120);

  setTimeout(function(){
    orb.pulse(1.5);
    closeSheet();
  }, 2600);
}

/* ================= 交互绑定 ================= */
$hold.addEventListener('pointerdown', function(e){
  e.preventDefault();
  startArm(e);
});
$hold.addEventListener('click', function(){
  if(state === 'choosing') closeChoosing();
});
window.addEventListener('pointerup', function(e){
  if(state === 'arming') endArm(e);
});
window.addEventListener('pointermove', onMove);
window.addEventListener('pointercancel', function(){
  if(state === 'arming') cancelArm();
});

window.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(state === 'mode') closeSheet();
    else if(state === 'choosing') closeChoosing();
    else if(state === 'arming') cancelArm();
  }
  if(e.key === 'r' || e.key === 'R'){
    if(state === 'idle'){ orb.reset(); today = []; renderNote(); }
  }
});

$('tabbar').addEventListener('click', function(e){
  var a = e.target.closest('a');
  if(!a) return;
  this.querySelectorAll('a').forEach(function(n){ n.classList.remove('on'); });
  a.classList.add('on');
});

renderNote();
raf = requestAnimationFrame(loop);

/* 验收钩子：#static&auto=choosing | photo | write | voice | blank | densify | filled
   filled 用一组「生活证据」把球填起来，看「留下很多之后」长什么样。 */
(function autoDemo(){
  var m = (location.hash.match(/auto=([a-z]+)/) || [])[1];
  if(!m) return;
  setTimeout(function(){
    if(m === 'choosing'){
      state = 'arming'; armT = 1;
      $('orbwrap').classList.add('pull');
      enterChoosing();
    }else if(m === 'densify'){
      for(var i = 0; i < 5; i++) orb.densify();
    }else if(m === 'filled'){
      for(var j = 0; j < 7; j++) orb.densify();
      today = [
        { t:'23:47', text:'洗衣机在转，没有别的声音' },
        { t:'00:18', text:'「终于没人找我了。」' },
        { t:'18:32', text:'窗外，有一段风声' }
      ];
      renderNote();
    }else{
      var dir = { photo:'right', write:'down', voice:'up', blank:'left' }[m];
      if(dir) choose(dir);
    }
  }, 80);
})();

})();
